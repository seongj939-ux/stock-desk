<style>
/* Layout: 위에 지표 띠, 왼쪽 큰 아이소메트릭 사무실(스테이션과 후보 전략 자리), 오른쪽 상세 패널, 아래 후보 목록.
   한 가지 밤 시간 화면으로 고정한 어두운 디자인. */
:root {
  color-scheme: dark;
  --bg: #0b0d12;
  --surface: #12151c;
  --surface-2: #181d27;
  --line: #252b38;
  --ink: #e9ecf2;
  --mute: #8e97a8;
  --faint: #596275;
  --floor: #131822;
  --floor-line: #1c2331;
  --wall-r: #0f131b;
  --wall-l: #0d1017;
  --desk: #2a3142;
  --desk-top: #3a4358;
  --quant: #5aa9ff;
  --valid: #f0b44c;
  --risk: #e879b9;
  --exec: #a78bfa;
  --meet: #5eead4;
  --good: #4ade9b;
  --bad: #ff6b6b;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1240px; margin-inline: auto; padding-inline: 16px; padding-block: 18px 40px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--quant); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; justify-content: space-between; }
h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--mute); font-size: 13px; margin: 2px 0 0; }
.badge { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--valid);
  border: 1px solid color-mix(in srgb, var(--valid) 45%, transparent); padding: 3px 8px; border-radius: 4px; }

.loadbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.ticker { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 16px; border-block: 1px solid var(--line); }
.stat { padding: 12px 14px 12px 0; min-width: 0; }
.stat + .stat { padding-left: 14px; border-left: 1px solid var(--line); }
.stat .k { display: block; font-size: 11px; color: var(--mute); letter-spacing: .06em; text-transform: uppercase; }
.stat .v { display: block; font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stat .n { display: block; font-size: 11px; color: var(--faint); margin-top: 2px; }
.up { color: var(--good); } .down { color: var(--bad); }
@media (max-width: 720px) {
  .ticker { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { padding-left: 0; border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
  .stat .v { font-size: 19px; }
}

.layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; align-items: start; }
@media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 12px; min-width: 0; }
.transport { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 8px 2px; }
.btn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--faint); }
.btn.primary { border-color: color-mix(in srgb, var(--quant) 60%, var(--line)); color: var(--quant); }
.hint { color: var(--mute); font-size: 12px; margin-left: auto; }
.scene-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
svg#scene { display: block; width: 100%; height: auto; }
.pan { display: none; color: var(--mute); font-size: 12px; padding: 0 8px; }
@media (max-width: 720px) {
  svg#scene { width: 760px; max-width: none; }
  .pan { display: block; }
}
.st { cursor: pointer; }
.st:hover .face-top { filter: brightness(1.35); }
.bubble { cursor: pointer; }
.seat { cursor: pointer; }
.floor-tile { fill: var(--floor); stroke: var(--floor-line); stroke-width: 1; }
.mono { font-family: var(--font-mono); }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.chip { animation: pop .35s ease-out both; transform-box: fill-box; }
.dot1 { animation: blink 1.1s infinite; } .dot2 { animation: blink 1.1s .18s infinite; } .dot3 { animation: blink 1.1s .36s infinite; }
@media (prefers-reduced-motion: reduce) { .chip, .dot1, .dot2, .dot3 { animation: none; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 16px; min-width: 0; min-height: 320px; }
.panel h2 { margin: 0; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.sw { width: 10px; height: 10px; border-radius: 2px; background: var(--c, var(--mute)); flex: none; }
.role { color: var(--mute); font-size: 12px; margin: 2px 0 10px; }
.tabs { display: flex; gap: 4px; margin: 8px 0 12px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; cursor: pointer; color: var(--mute); font-size: 13px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--c, var(--quant)); }
.empty { color: var(--mute); font-size: 13px; }
.list { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; padding-right: 2px; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); min-width: 0; }
.item.sel { border-color: var(--valid); }
.item .t { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; justify-content: space-between; }
.item .name { font-weight: 500; overflow-wrap: anywhere; }
.item .par { font-family: var(--font-mono); font-size: 11px; color: var(--mute); overflow-wrap: anywhere; }
.stg { font-size: 12px; color: var(--mute); margin-top: 4px; display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 0 4px; }
.pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
.pill.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 50%, transparent); }
.pill.no { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.pill.wait { color: var(--mute); border-color: var(--line); }
.msg { display: flex; flex-direction: column; gap: 2px; max-width: 94%; }
.msg .who { font-size: 11px; color: var(--c); font-weight: 600; }
.msg .txt { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px 12px 12px 12px; padding: 7px 11px; font-size: 13px; overflow-wrap: anywhere; }
.msg .ts { font-family: var(--font-mono); font-size: 10px; color: var(--faint); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--mute); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; }
.funnel { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.frow { display: grid; grid-template-columns: 112px minmax(0, 1fr) 36px; gap: 10px; align-items: center; font-size: 13px; }
.fbar { height: 10px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.fbar i { display: block; height: 100%; background: var(--quant); border-radius: 3px; }
.fnum { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.note { color: var(--mute); font-size: 12px; margin: 12px 0 0; }

section.cands { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 10px; }
.cands h2 { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.fchip { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; cursor: pointer; color: var(--mute); font-size: 12px; }
.fchip[aria-pressed="true"] { color: var(--ink); border-color: var(--quant); }
.err { padding: 24px; color: var(--mute); }
</style>

    <aside class="panel" id="panel" aria-live="polite"></aside>

    <div class="scroll-x" id="table"></div>

</div>

    var g = '<g style="--c:' + col + '"><g class="st" data-st="meeting" tabindex="0" role="button" aria-label="회의실: 에이전트 전략 토론">';
    var ids = ["quant", "critic", "risk", "chair"], people = "";
    ids.forEach(function (id, i) {
      var hd = iso(gx + 0.9 + i * 1.3, gy - 0.35, 1.3), bd = iso(gx + 0.9 + i * 1.3, gy - 0.35, 0.85), c = "var(" + ROLE_C[id] + ")";
      people += '<ellipse cx="' + bd[0].toFixed(1) + '" cy="' + bd[1].toFixed(1) + '" rx="5.2" ry="6.5" fill="' + c + '"/><circle cx="' + hd[0].toFixed(1) + '" cy="' + hd[1].toFixed(1) + '" r="3.8" fill="' + c + '"/>';
    });
    g += people;
    g += poly(f.side, "", "fill:color-mix(in srgb," + col + " 12%,var(--surface));stroke:" + col) + poly(f.front, "", "fill:color-mix(in srgb," + col + " 20%,var(--surface));stroke:" + col) + poly(f.top, "face-top", "fill:color-mix(in srgb," + col + " 30%,var(--surface));stroke:" + col);
    var corner = iso(gx, gy + d, h);
    g += '<g transform="matrix(0.866 0.5 0 1 ' + corner[0].toFixed(1) + ' ' + corner[1].toFixed(1) + ')"><text x="9" y="17" font-size="12" font-weight="600" fill="var(--ink)">회의실</text></g></g>';
    var top = iso(gx + w / 2, gy + d / 2, h), cx = top[0] + 70, by = top[1] - 62, fill = speaking ? "color-mix(in srgb," + col + " 35%,var(--bg))" : "var(--bg)";
    g += '<g class="bubble" data-bub="meeting" tabindex="0" role="button" aria-label="회의실 대화 열기"><rect x="' + (cx - 19).toFixed(1) + '" y="' + by.toFixed(1) + '" width="38" height="20" rx="10" fill="' + fill + '" stroke="' + col + '"/>' +
      '<path d="M' + (cx - 4).toFixed(1) + ' ' + (by + 19.5).toFixed(1) + 'l4 6 4 -6z" fill="' + fill + '" stroke="' + col + '" stroke-linejoin="round"/>' +
      (speaking ? '<circle class="dot1" cx="' + (cx - 8).toFixed(1) + '" cy="' + (by + 10).toFixed(1) + '" r="2.4" fill="' + col + '"/><circle class="dot2" cx="' + cx.toFixed(1) + '" cy="' + (by + 10).toFixed(1) + '" r="2.4" fill="' + col + '"/><circle class="dot3" cx="' + (cx + 8).toFixed(1) + '" cy="' + (by + 10).toFixed(1) + '" r="2.4" fill="' + col + '"/>'
        : '<text x="' + cx.toFixed(1) + '" y="' + (by + 14).toFixed(1) + '" font-size="11" text-anchor="middle" fill="' + col + '" class="mono">' + cnt + '</text>') + '</g>';
    if (speaking) g += chipSvg(cx, by - 12, chipFor(cur));
    return g + '</g>';
  }

  function renderScene() {
    var s = '';
    s += poly([P(0, 0, 0), P(N, 0, 0), P(N, 0, 4.6), P(0, 0, 4.6)].join(" "), "", "fill:var(--wall-r)");
    s += poly([P(0, 0, 0), P(0, N, 0), P(0, N, 4.6), P(0, 0, 4.6)].join(" "), "", "fill:var(--wall-l)");
    s += poly([P(0, 0, 0), P(N, 0, 0), P(N, N, 0), P(0, N, 0)].join(" "), "floor-tile");
    for (var i = 1; i < N; i++) {
      s += '<line x1="' + iso(i, 0)[0].toFixed(1) + '" y1="' + iso(i, 0)[1].toFixed(1) + '" x2="' + iso(i, N)[0].toFixed(1) + '" y2="' + iso(i, N)[1].toFixed(1) + '" stroke="var(--floor-line)"/>';
      s += '<line x1="' + iso(0, i)[0].toFixed(1) + '" y1="' + iso(0, i)[1].toFixed(1) + '" x2="' + iso(N, i)[0].toFixed(1) + '" y2="' + iso(N, i)[1].toFixed(1) + '" stroke="var(--floor-line)"/>';
    }
    s += screens();
    STATIONS.forEach(function (st) { if (!st.room) s += stationSvg(st); });
    s += seatsSvg();
    s += meetingSvg();
    var extra = cands.length > 24 ? '<text x="16" y="580" font-size="11" fill="var(--mute)">자리는 24개까지만 표시합니다 (전체 ' + cands.length + '개는 아래 목록)</text>' : "";
    document.getElementById("scene").innerHTML = s + extra;
  }

  /* ---------- 오른쪽 패널 ---------- */
  function funnelHtml() {
    var n = cands.length || 1;
    function cnt(name) { return cands.filter(function (c) { return c.stages.some(function (g) { return g.stage === name && g.passed; }); }).length; }
    var rows = [["후보", cands.length], ["안 본 구간", cnt("안 본 구간")], ["보유보다 나음", cnt("바이앤홀드 비교")], ["흔들어도 통과", cnt("파라미터 흔들기")], ["비용 올려도 통과", cnt("비용 상향")]];
    return '<div class="funnel">' + rows.map(function (r) {
      return '<div class="frow"><span>' + r[0] + '</span><span class="fbar"><i style="width:' + (r[1] / n * 100).toFixed(0) + '%"></i></span><span class="fnum">' + r[1] + '</span></div>';
    }).join("") + '</div>';
  }
  function overviewHtml() {
    return '<h2>오늘의 데스크</h2><p class="role">스테이션과 회의실이 순서대로 일합니다</p>' + funnelHtml() +
      (S.universe ? '<p class="note">매매 대상은 S&amp;P 500 구성종목(' + S.universe.size + '개)뿐입니다. 이번에는 ' + S.universe.scanned + '개를 훑었고, 그 밖의 종목은 코드가 매수를 거부합니다.</p>' : '') + '<p class="note">전략은 안 본 구간, 그냥 보유하는 것과 비교, 파라미터 흔들기, 비용 상향 순으로 걸러집니다. 대부분 앞 단계에서 떨어지는 것이 정상입니다.</p>' +
      '<p class="note">자리의 사람은 후보 전략 하나입니다. 회색은 대기, 초록은 통과, 어두운 빨강은 탈락입니다.</p>';
  }
  function stageHtml(c) {
    return c.stages.map(function (g) {
      return '<span style="color:' + (g.passed ? "var(--good)" : "var(--bad)") + '">' + (g.passed ? "✓" : "✗") + '</span><span>' + esc(g.stage) + ': ' + esc(g.detail) + '</span>';
    }).join("");
  }
  function candItem(c, k) {
    var st = candState(k), pill = st === "pass" ? '<span class="pill ok">통과</span>' : st === "fail" ? '<span class="pill no">탈락 · ' + esc(c.failed_stage) + '</span>' : '<span class="pill wait">대기</span>';
    return '<div class="item' + (sel.cand === k ? " sel" : "") + '"><div class="t"><span class="name">' + esc(c.symbol) + ' · ' + esc(c.name) + '</span>' + pill + '</div><div class="par">' + esc(paramText(c.params)) + '</div>' +
      (st === "wait" ? "" : '<div class="stg">' + stageHtml(c) + '</div>') + '</div>';
  }
  function workHtml(id) {
    var vis = visible();
    if (id === "quant") {
      var seen = cands.filter(function (c, k) { var e = ev.find(function (x) { return x.who === "quant" && x.msg.indexOf(c.symbol + ":") === 0; }); return e && e.i <= step; });
      if (!seen.length) return '<p class="empty">아직 제안한 전략이 없습니다.</p>';
      return '<div class="list">' + seen.map(function (c) { return '<div class="item"><div class="t"><span class="name">' + esc(c.symbol) + ' · ' + esc(c.name) + '</span></div><div class="par">' + esc(paramText(c.params)) + '</div>' + (c.rationale ? '<div class="stg" style="grid-template-columns:minmax(0,1fr)"><span>' + esc(c.rationale) + '</span></div>' : "") + '</div>'; }).join("") + '</div>';
    }
    if (id === "meeting") return meetingHtml();
    if (id === "validate") {
      var items = cands.map(function (c, k) { return candState(k) === "wait" ? "" : candItem(c, k); }).join("");
      return items ? '<div class="list">' + items + '</div>' : '<p class="empty">아직 검증한 전략이 없습니다.</p>';
    }
    if (id === "risk") {
      var L = S.limits || {}, rows = [["종목당 최대 비중", Math.round(L.max_position_weight * 100) + "%"], ["거래당 최대 손실", (L.max_loss_per_trade * 100).toFixed(0) + "%"], ["하루 최대 손실", (L.max_daily_loss * 100).toFixed(0) + "%"]];
      var t = '<div class="scroll-x"><table><tbody>' + rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td class="num">' + r[1] + '</td></tr>'; }).join("") + '</tbody></table></div>';
      var logs = vis.filter(function (e) { return e.who === "risk"; });
      return t + '<p class="note">한도는 AI가 아니라 규칙 코드가 지킵니다. 손절가가 없는 주문은 항상 거부됩니다.</p>' +
        (logs.length ? '<div class="list" style="margin-top:10px">' + logs.map(function (e) { return '<div class="item">' + esc(e.msg) + '</div>'; }).join("") + '</div>' : '<p class="empty" style="margin-top:10px">이번 실행에서 검사한 주문이 없습니다.</p>');
    }
    var props = S.proposals || [];
    var propHtml = props.length
      ? '<div class="scroll-x"><table><thead><tr><th>종목</th><th>방향</th><th class="num">수량</th><th class="num">기준가</th></tr></thead><tbody>' +
        props.map(function (p) { return '<tr><td>' + esc(p.symbol) + '</td><td>' + (p.side === "BUY" ? "매수" : "매도") + '</td><td class="num">' + p.qty + '</td><td class="num">' + Number(p.ref_price).toFixed(2) + '</td></tr>'; }).join("") +
        '</tbody></table></div><p class="note">승인 대기 ' + props.length + '건입니다. 터미널에서 <code>python -m agent.approve</code> 로 종목 코드를 입력해야 주문이 나갑니다.</p>'
      : "";
    var os = (S.orders || []).filter(function () { return vis.some(function (e) { return e.who === "exec" && isOrderMsg(e.msg); }); });
    var tbl = os.length ? '<div class="scroll-x"><table><thead><tr><th>종목</th><th>방향</th><th class="num">수량</th><th class="num">가격</th><th class="num">손절</th></tr></thead><tbody>' +
      os.map(function (o) { return '<tr><td>' + esc(o.symbol) + '</td><td>' + (String(o.side).toLowerCase() === "buy" ? "매수" : "매도") + '</td><td class="num">' + o.qty + '</td><td class="num">' + Number(o.price).toFixed(2) + '</td><td class="num">' + (o.stop ? Number(o.stop).toFixed(2) : "-") + '</td></tr>'; }).join("") + '</tbody></table></div>' : '<p class="empty">전송한 주문이 없습니다. 자체 모의투자는 <code>--auto --broker local</code> 로 실행합니다.</p>';
    var el = vis.filter(function (e) { return e.who === "exec"; });
    return propHtml + (props.length ? "" : tbl) + (el.length ? '<div class="list" style="margin-top:10px">' + el.map(function (e) { return '<div class="item">' + esc(e.msg) + '</div>'; }).join("") + '</div>' : "");
  }
  function meetingHtml() {
    if (!M) return '<p class="empty">이 실행에는 회의 기록이 없습니다.</p>';
    var sm = M.summary || {}, U = S.universe || {};
    var head = '<div class="scroll-x"><table><tbody>' +
      '<tr><td>기준 종목</td><td class="num">S&amp;P 500 ' + (U.size || "-") + '개 (' + esc(U.source || "") + ')</td></tr>' +
      '<tr><td>훑어본 종목</td><td class="num">' + (sm.scanned || 0) + '개 · 전략 ' + (sm.tested || 0) + '개</td></tr>' +
      '<tr><td>회의에 올린 종목</td><td class="num">' + (sm.shortlisted || 0) + '개</td></tr>' +
      '<tr><td>신규 매수 후보</td><td class="num">' + ((M.selected || []).join(", ") || "없음") + ' (최대 ' + M.max_positions + '종목)</td></tr></tbody></table></div>';
    var ts = M.transcript || [];
    var body = ts.map(function (t) {
      var msgs = t.messages.map(function (m) {
        return '<div class="msg" style="--c:var(' + ROLE_C[m.role] + ')"><span class="who">' + esc((M.roles.filter(function (r) { return r.id === m.role; })[0] || { label: m.role }).label) + '</span><span class="txt">' + esc(m.msg) + '</span></div>';
      }).join("");
      return '<div class="item"><div class="t"><span class="name">' + esc(t.symbol) + '</span><span class="par">' + (t.round ? t.round + '라운드' : '스크리닝') + '</span></div><div class="list" style="margin-top:6px;max-height:none">' + msgs + '</div></div>';
    }).join("");
    return head + '<p class="note">회의는 안 본 구간(뒤 30%)을 보지 못합니다. 앞 70%에서 앞뒤 절반 모두 통하는 전략만 키우고, 결론만 안 본 구간 검증을 한 번 받습니다.</p><div class="list" style="margin-top:10px">' + body + '</div>';
  }
  function chatHtml(id) {
    var msgs = visible().filter(function (e) { return e.who === id; });
    if (!msgs.length) return '<p class="empty">아직 오간 말이 없습니다.</p>';
    return '<div class="list" id="chat">' + msgs.map(function (e) {
      var tm = new Date(e.t); var ts = isNaN(tm) ? "" : tm.toLocaleTimeString("ko-KR", { hour12: false });
      return '<div class="msg" style="--c:var(' + BY[id].c + ')"><span class="who">' + BY[id].label + '</span><span class="txt">' + esc(e.msg) + '</span><span class="ts">' + ts + '</span></div>';
    }).join("") + '</div>';
  }
  function renderPanel() {
    var el = document.getElementById("panel");
    if (!sel.station) { el.innerHTML = overviewHtml(); return; }
    var s = BY[sel.station];
    el.style.setProperty("--c", "var(" + s.c + ")");
    el.innerHTML = '<h2><span class="sw" style="--c:var(' + s.c + ')"></span>' + s.label + '</h2><p class="role">' + s.role + '</p>' +
      '<div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="work" aria-selected="' + (sel.tab === "work") + '">작업</button><button class="tab" role="tab" data-tab="chat" aria-selected="' + (sel.tab === "chat") + '">대화</button><button class="tab" data-tab="none" style="margin-left:auto">닫기</button></div>' +
      (sel.tab === "work" ? workHtml(s.id) : chatHtml(s.id));
    var chat = document.getElementById("chat"); if (chat) chat.scrollTop = chat.scrollHeight;
  }

  /* ---------- 후보 표 ---------- */
  function renderTable() {
    var counts = { all: cands.length, pass: cands.filter(function (c) { return c.passed; }).length };
    counts.fail = counts.all - counts.pass;
    document.getElementById("filters").innerHTML = [["all", "전체"], ["pass", "통과"], ["fail", "탈락"]].map(function (f) {
      return '<button class="fchip" data-f="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + ' ' + counts[f[0]] + '</button>';
    }).join("");
    var rows = cands.map(function (c, k) { return { c: c, k: k }; }).filter(function (r) { return filter === "all" || (filter === "pass") === r.c.passed; })
      .sort(function (a, b) { return b.c.oos_sharpe - a.c.oos_sharpe; });
    document.getElementById("table").innerHTML = '<table><thead><tr><th>종목</th><th>전략</th><th>파라미터</th><th class="num">안 본 구간 샤프</th><th class="num">안 본 구간 수익</th><th>결과</th></tr></thead><tbody>' +
      rows.map(function (r) {
        var c = r.c;
        return '<tr><td>' + esc(c.symbol) + '</td><td>' + esc(c.name) + '</td><td class="mono" style="font-size:12px;color:var(--mute)">' + esc(paramText(c.params)) + '</td><td class="num">' + c.oos_sharpe.toFixed(2) + '</td><td class="num ' + (c.oos_return >= 0 ? "up" : "down") + '">' + (c.oos_return * 100).toFixed(1) + '%</td><td>' +
          (c.passed ? '<span class="pill ok">통과</span>' : '<span class="pill no">탈락 · ' + esc(c.failed_stage) + '</span>') + '</td></tr>';
      }).join("") + '</tbody></table>';
  }

  /* ---------- 재생과 이벤트 ---------- */
  function renderAll() { renderTicker(); renderScene(); renderPanel(); document.getElementById("play").textContent = playing ? "⏸ 일시정지" : "▶ 처음부터 재생"; }
  function stop() { playing = false; if (timer) { clearInterval(timer); timer = null; } }
  function play() {
    stop(); step = -1; playing = true; renderAll();
    timer = setInterval(function () { if (step >= LAST) { stop(); renderAll(); return; } step += 1; renderAll(); }, 650);
  }

  document.getElementById("play").addEventListener("click", function () { if (playing) { stop(); renderAll(); } else { play(); } });
  document.getElementById("skip").addEventListener("click", function () { stop(); step = LAST; renderAll(); });
  document.getElementById("filters").addEventListener("click", function (e) { var b = e.target.closest("[data-f]"); if (b) { filter = b.getAttribute("data-f"); renderTable(); } });
  document.getElementById("panel").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]"); if (!b) return;
    var t = b.getAttribute("data-tab");
    if (t === "none") { sel.station = null; sel.cand = -1; } else { sel.tab = t; }
    renderAll();
  });
  function sceneAct(t) {
    var st = t.closest("[data-st]"), bub = t.closest("[data-bub]"), seat = t.closest("[data-seat]");
    if (bub) { sel.station = bub.getAttribute("data-bub"); sel.tab = "chat"; sel.cand = -1; }
    else if (st) { sel.station = st.getAttribute("data-st"); sel.tab = "work"; sel.cand = -1; }
    else if (seat) { sel.station = "validate"; sel.tab = "work"; sel.cand = parseInt(seat.getAttribute("data-seat"), 10); }
    else return;
    renderAll();
  }
  var scene = document.getElementById("scene");
  scene.addEventListener("click", function (e) { sceneAct(e.target); });
  scene.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sceneAct(e.target); } });

  var fileIn = document.getElementById("stateFile"), msg = document.getElementById("loadMsg"), rs = document.getElementById("resetState");
  rs.hidden = !mine;
  msg.textContent = mine ? "내가 올린 결과를 보고 있습니다 (이 기기에만 저장)" : "지금은 합성 데이터 데모입니다. 코랩에서 받은 state.json 을 올리면 내 결과가 나옵니다";
  fileIn.addEventListener("change", function () {
    var f = fileIn.files && fileIn.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var o = JSON.parse(r.result);
        if (!o.candidates || !o.log) throw new Error("state.json 형식이 아닙니다");
        localStorage.setItem("deskState", JSON.stringify(o)); location.reload();
      } catch (e) { msg.textContent = "불러오지 못했습니다: " + e.message; }
    };
    r.readAsText(f);
  });
  rs.addEventListener("click", function () { try { localStorage.removeItem("deskState"); } catch (e) {} location.reload(); });
  document.getElementById("goal").textContent = "목표: " + (S.goal || "");
  document.getElementById("badge").textContent = S.mode === "synthetic" ? "합성 데이터 시연" : (S.equity_source === "paper-account" ? "실데이터 · 모의투자" : "실데이터 · 백테스트");
  renderTable();
  renderAll();
  var sc = document.getElementById("sceneScroll");
  if (sc) sc.scrollLeft = Math.max(0, (sc.scrollWidth - sc.clientWidth) / 2);
})();
</script>
</body>
</html>
